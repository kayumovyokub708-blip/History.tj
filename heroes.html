<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Қаҳрамонони миллати тоҷик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0c2e24 0%, #1e4d3a 50%, #0c2e24 100%);
            color: #f8e9c9;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .history-parchment {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="%23d4af37" stroke-width="0.3" opacity="0.2"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grid)"/></svg>'), radial-gradient(ellipse at 30% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            z-index: -2;
        }

        .app {
            max-width: 1300px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            padding: 40px;
            background: rgba(12, 46, 36, 0.85);
            border-radius: 30px;
            border: 3px solid #d4af37;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 52px;
            background: linear-gradient(45deg, #f8e9c9, #d4af37, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .back-button {
            background: rgba(12, 46, 36, 0.8);
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 50px;
            padding: 14px 28px;
            text-decoration: none;
            color: #f8e9c9;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .back-button:hover {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.2);
            transform: translateY(-3px);
        }

        .heroes-section {
            background: rgba(12, 46, 36, 0.85);
            border-radius: 40px;
            padding: 50px;
            margin: 50px 0;
            border: 2px solid rgba(212, 175, 55, 0.5);
            backdrop-filter: blur(10px);
        }

        .heroes-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .heroes-header h2 {
            font-size: 42px;
            color: #d4af37;
        }

        .heroes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .hero-card {
            background: rgba(12, 46, 36, 0.7);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .hero-card:hover {
            transform: translateY(-8px);
            border-color: #d4af37;
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.2);
            background: rgba(12, 46, 36, 0.9);
        }

        .hero-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .hero-name {
            font-size: 26px;
            color: #d4af37;
            margin-bottom: 8px;
        }

        .hero-years {
            font-size: 16px;
            color: rgba(248, 233, 201, 0.7);
            margin-bottom: 12px;
        }

        .hero-title {
            font-size: 16px;
            font-style: italic;
            color: #d4af37;
        }

        /* MODAL STYLES */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #0c2e24, #1a4a38);
            border: 3px solid #d4af37;
            border-radius: 30px;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            color: #f8e9c9;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 40px;
            cursor: pointer;
            color: #d4af37;
            transition: 0.2s;
        }

        .close-modal:hover {
            transform: scale(1.2);
        }

        .modal-icon {
            font-size: 70px;
            text-align: center;
            margin-bottom: 10px;
        }

        .modal-name {
            font-size: 36px;
            color: #d4af37;
            text-align: center;
            border-bottom: 2px solid #d4af37;
            display: inline-block;
            width: auto;
            margin: 0 auto 15px;
            padding-bottom: 8px;
        }

        .modal-years {
            text-align: center;
            font-size: 20px;
            color: rgba(248, 233, 201, 0.8);
            margin-bottom: 20px;
        }

        .modal-title {
            text-align: center;
            font-size: 22px;
            font-style: italic;
            color: #d4af37;
            margin-bottom: 20px;
        }

        .modal-description {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 20px;
            text-align: justify;
        }

        .modal-list {
            list-style: none;
            padding: 0;
        }

        .modal-list li {
            padding: 8px 0 8px 28px;
            position: relative;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .modal-list li:before {
            content: "✨";
            position: absolute;
            left: 0;
            color: #d4af37;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
        }

        @media (max-width: 768px) {
            h1 { font-size: 36px; }
            .heroes-grid { grid-template-columns: 1fr; }
            .modal-content { padding: 20px; }
            .modal-name { font-size: 28px; }
        }
    </style>
</head>

    <div class="footer">
        <p>© 2026 Маркази таърихии Тоҷикистон | Иҷрокунанда: Қаюмов Ёқуб</p>
    </div>
</div>

<!-- Modal -->
<div id="heroModal" class="modal">
    <div class="modal-content">

    </div>
</div>

    function renderHeroes() {
        const container = document.getElementById('heroesGrid');
        container.innerHTML = '';
        heroesData.forEach(hero => {
            const card = document.createElement('div');
            card.className = 'hero-card';
            const imageHTML = hero.image ? 
                `<img src="${hero.image}" alt="${hero.name}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 15px; margin-bottom: 15px;">` :
                `<div class="hero-icon">${hero.icon}</div>`;
            card.innerHTML = `
                ${imageHTML}
                <div class="hero-name">${hero.name}</div>
                <div class="hero-years">(${hero.years})</div>
                <div class="hero-title">${hero.title}</div>
            `;
            card.addEventListener('click', () => showModal(hero));
            container.appendChild(card);
        });
    }

    function showModal(hero) {
        const iconHTML = hero.image ? 
            `<img src="${hero.image}" alt="${hero.name}" style="width: 100%; max-width: 400px; border-radius: 20px; margin-bottom: 20px; border: 3px solid #d4af37;">` :
            `<div class="modal-icon">${hero.icon}</div>`;
        document.getElementById('modalIcon').innerHTML = iconHTML;
        document.getElementById('modalName').innerHTML = hero.name;
        document.getElementById('modalYears').innerHTML = hero.years;
        document.getElementById('modalTitle').innerHTML = hero.title;
        document.getElementById('modalDescription').innerHTML = hero.description;
        
        const listContainer = document.getElementById('modalList');
        listContainer.innerHTML = '';
        hero.achievements.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = item;
            listContainer.appendChild(li);
        });
        
        document.getElementById('heroModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('heroModal').style.display = 'none';
    }

    document.querySelector('.close-modal').addEventListener('click', closeModal);
    window.addEventListener('click', (e) => {
        const modal = document.getElementById('heroModal');
        if (e.target === modal) closeModal();
    });

    renderHeroes();
</script>

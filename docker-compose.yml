version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: history_tj_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: history
      POSTGRES_PASSWORD: history_secret
      POSTGRES_DB: history_tj
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U history -d history_tj"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend will be added later
  # backend:
  #   build: ./backend
  #   ports:
  #     - "8000:8000"
  #   env_file:
  #     - .env
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  postgres_data:

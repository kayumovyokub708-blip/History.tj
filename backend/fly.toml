# Fly.io — Histori.tj API
# cd backend && fly launch --copy-config --no-deploy
# fly secrets set ...
# fly deploy

app = 'histori-tj-api'
primary_region = 'fra'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
